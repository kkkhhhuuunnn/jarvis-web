<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. - Precision Audio Engine</title>
  <style>
    :root { --bg: #050811; --cyan: #00f0ff; --dim-cyan: rgba(0, 240, 255, 0.2); }
    body {
      margin: 0; background: var(--bg); color: var(--cyan);
      font-family: 'Segoe UI', -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .config-bar {
      width: 90%; max-width: 650px; margin-top: 15px; padding: 10px;
      border: 1px solid var(--dim-cyan); border-radius: 8px; display: flex; gap: 8px;
    }
    .config-bar input {
      flex: 1; background: transparent; border: 1px solid var(--dim-cyan);
      color: var(--cyan); padding: 8px; border-radius: 4px; font-size: 13px;
    }
    .config-bar button {
      background: var(--cyan); color: #000; border: none; padding: 8px 14px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .status-bar {
      width: 90%; max-width: 650px; margin-top: 8px; font-size: 12px;
      display: flex; justify-content: space-between; color: rgba(0, 240, 255, 0.7);
    }
    .status-bar span { cursor: pointer; text-decoration: underline; }
    .reactor-container { margin: 15px 0 10px; }
    .reactor {
      width: 110px; height: 110px; border-radius: 50%;
      border: 2px dashed var(--cyan); box-shadow: 0 0 20px var(--cyan);
      animation: rotate 10s linear infinite;
    }
    .reactor.speaking { animation: pulse 0.8s infinite alternate, rotate 3s linear infinite; }
    @keyframes rotate { 100% { transform: rotate(360deg); } }
    @keyframes pulse { to { box-shadow: 0 0 45px var(--cyan), inset 0 0 20px var(--cyan); } }
    .terminal {
      width: 90%; max-width: 650px; height: 380px; border: 1px solid var(--dim-cyan);
      border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      box-sizing: border-box; background: rgba(0, 10, 20, 0.5); font-size: 14px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; }
    .msg.user { align-self: flex-end; background: rgba(0, 240, 255, 0.15); border: 1px solid var(--cyan); }
    .msg.jarvis { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--cyan); }
    .msg.error { align-self: flex-start; background: rgba(255, 50, 50, 0.1); border-left: 3px solid #ff3333; color: #ff8888; }
    .controls { width: 90%; max-width: 650px; margin: 15px 0 25px; display: flex; gap: 10px; }
    .controls input {
      flex: 1; padding: 12px; background: transparent; border: 1px solid var(--dim-cyan);
      border-radius: 6px; color: #fff; outline: none;
    }
    .controls button {
      background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
      padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .controls button:hover { background: var(--cyan); color: #000; }
    .controls button.active { background: #ff3366 !important; border-color: #ff3366 !important; color: #fff !important; }
  </style>
</head>
<body>

  <div class="config-bar">
    <input type="password" id="groqKey" placeholder="Groq API Key (gsk_...)를 입력하세요">
    <button onclick="saveKey()">저장</button>
  </div>

  <div class="status-bar">
    <div id="memoryStatus">엔진: 자비스 정밀 음향 & 음성 모델 가동 중</div>
    <span onclick="resetAllMemory()">⚠️ 기억 초기화</span>
  </div>

  <div class="reactor-container">
    <div class="reactor" id="reactor"></div>
  </div>

  <div class="terminal" id="chat"></div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="지시를 내리거나 마이크 버튼을 누르십시오..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">전송</button>
    <button id="micBtn" onclick="toggleMic()">🎤 음성</button>
  </div>

  <script>
    const RETENTION_DAYS = 30;
    let cachedModel = null;
    let chatHistory = [];
    let userProfileMemory = "";
    let recognition = null;
    let isRecording = false;
    let silenceTimer = null;
    let selectedVoice = null;

    // 자주 왜곡되는 고유명사/학술용어 발음 교정 테이블
    const PHONETIC_DICTIONARY = [
      { regex: /재미\s*난\s*일|재미\s*나이|재미\s*난\s*이|재미\s*나/gi, replace: "제미나이" },
      { regex: /오픈\s*에이\s*아이|오픈\s*에이|오픈\s*애이/gi, replace: "오픈AI" },
      { regex: /챗\s*지\s*피\s*티|첫\s*지피티/gi, replace: "ChatGPT" },
      { regex: /보안\s*수학|보안\s*함수/gi, replace: "도함수" },
      { regex: /자\s*비\s*스|자\s*비스/gi, replace: "자비스" },
      { regex: /행복\s*좋\s*되/gi, replace: "행복주택" }
    ];

    window.onload = () => {
      document.getElementById('groqKey').value = localStorage.getItem('jarvis_groq_key') || '';
      loadMemoryFromStorage();
      renderChatLogs();
      initSTT();
      initTTSVoice();
    };

    // 최적의 남성 보이스 탐색 (자비스 느낌 연출)
    function initTTSVoice() {
      if (!window.speechSynthesis) return;
      const updateVoices = () => {
        const voices = window.speechSynthesis.getVoices();
        // 한국어 음성 중 남성 톤을 우선 검색
        selectedVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('Male') || v.name.includes('InJoon') || v.name.includes('남성')))
                     || voices.find(v => v.lang.includes('ko')) 
                     || null;
      };
      updateVoices();
      window.speechSynthesis.onvoiceschanged = updateVoices;
    }

    function saveKey() {
      const key = document.getElementById('groqKey').value.trim();
      localStorage.setItem('jarvis_groq_key', key);
      cachedModel = null;
      alert('Groq API 키가 저장되었습니다.');
    }

    function loadMemoryFromStorage() {
      const now = new Date().getTime();
      const rawLogs = localStorage.getItem('jarvis_chat_logs_groq');
      userProfileMemory = localStorage.getItem('jarvis_profile_groq') || "사용자에 대해 수집된 기본 정보 없음";

      if (rawLogs) {
        const parsed = JSON.parse(rawLogs);
        const limitMs = RETENTION_DAYS * 24 * 60 * 60 * 1000;
        chatHistory = parsed.filter(item => (now - item.timestamp) < limitMs);
        saveLogsToStorage();
      } else {
        chatHistory = [
          { role: 'assistant', content: "Systems online, Sir. 자비스 프로토콜이 정상 가동 중입니다. 말씀하십시오.", timestamp: now }
        ];
      }
    }

    function saveLogsToStorage() {
      localStorage.setItem('jarvis_chat_logs_groq', JSON.stringify(chatHistory));
      localStorage.setItem('jarvis_profile_groq', userProfileMemory);
    }

    function renderChatLogs() {
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      chatHistory.forEach(item => {
        appendMsgToDOM(item.role === 'user' ? 'user' : 'jarvis', item.content);
      });
    }

    function appendMsgToDOM(role, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function resetAllMemory() {
      if (confirm("대화 기록과 기억을 모두 초기화하시겠습니까?")) {
        localStorage.removeItem('jarvis_chat_logs_groq');
        localStorage.removeItem('jarvis_profile_groq');
        chatHistory = [];
        location.reload();
      }
    }

    // 대화용 모델만 필터링 (가드레일/검사용 모델 제외)
    async function getAvailableModel(apiKey) {
      if (cachedModel) return cachedModel;
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          const textModels = data.data
            .map(m => m.id)
            .filter(id => !id.includes("guard") && !id.includes("whisper") && !id.includes("moderation"));

          const preferred = textModels.find(m => m.includes("llama-3.1-8b") || m.includes("llama-3.3") || m.includes("mixtral") || m.includes("gemma"));
          cachedModel = preferred || textModels[0];
          document.getElementById('memoryStatus').innerText = `연결 모델: ${cachedModel}`;
          return cachedModel;
        }
      } catch (e) {
        console.error("모델 목록 조회 실패", e);
      }
      return "llama-3.1-8b-instant";
    }

    // 1차: 사전 기반 음소 교정
    function applyDictionaryCorrection(text) {
      let corrected = text;
      PHONETIC_DICTIONARY.forEach(item => {
        corrected = corrected.replace(item.regex, item.replace);
      });
      return corrected;
    }

    function initSTT() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;

      recognition = new SR();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 3;

      let transcriptAccumulator = '';

      recognition.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) {
          if (e.results[i].isFinal) {
            transcriptAccumulator += ' ' + e.results[i][0].transcript;
          } else {
            interim += e.results[i][0].transcript;
          }
        }
        
        let fullText = (transcriptAccumulator + ' ' + interim).trim();
        // 실시간으로 발음 교정 적용
        document.getElementById('userInput').value = applyDictionaryCorrection(fullText);

        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (isRecording && document.getElementById('userInput').value.trim()) {
            stopMic();
            send();
          }
        }, 1100);
      };

      recognition.onerror = () => stopMicUI();
      recognition.onend = () => {
        if (isRecording) recognition.start();
      };
    }

    function stopMic() {
      clearTimeout(silenceTimer);
      if (recognition) recognition.stop();
      stopMicUI();
    }

    function stopMicUI() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('active');
    }

    function toggleMic() {
      if (!recognition) return alert('PC 크롬 브라우저를 사용해주세요.');
      if (isRecording) {
        stopMic();
      } else {
        try {
          document.getElementById('userInput').value = '';
          recognition.start();
          isRecording = true;
          document.getElementById('micBtn').classList.add('active');
        } catch (e) {
          stopMicUI();
        }
      }
    }

    async function send() {
      const input = document.getElementById('userInput');
      let text = input.value.trim();
      const apiKey = localStorage.getItem('jarvis_groq_key');

      if (!text) return;
      if (!apiKey) return alert('Groq API Key를 입력하고 저장을 눌러주세요.');

      // 1차 단어장 교정 재확인
      text = applyDictionaryCorrection(text);

      const now = new Date().getTime();
      appendMsgToDOM('user', text);
      input.value = '';

      chatHistory.push({ role: 'user', content: text, timestamp: now });

      const systemInstruction = `당신은 마블의 AI 비서 '자비스(J.A.R.V.I.S.)'입니다.
- 주인님을 항상 'Sir' 또는 '주인님'으로 정중하게 부르십시오.
- 영국식 집사처럼 차분하고, 논리적이며, 위트 있는 지적인 어조를 유지하십시오.
- 음성 대화용이므로 1~2문장으로 아주 짤막하고 명확하게 한국어로 응답하십시오.
- 사용자가 질문 중 기술 용어(제미나이, 오픈AI 등)를 언급하면 맥락을 파악하여 정확하게 답변하십시오.
- [기억 데이터]: ${userProfileMemory}`;

      const messagesPayload = [
        { role: 'system', content: systemInstruction },
        ...chatHistory.slice(-8).map(m => ({ role: m.role, content: m.content }))
      ];

      try {
        const activeModel = await getAvailableModel(apiKey);

        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: activeModel,
            messages: messagesPayload,
            temperature: 0.5,
            max_tokens: 150
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.choices[0].message.content.trim();
        appendMsgToDOM('jarvis', reply);
        chatHistory.push({ role: 'assistant', content: reply, timestamp: new Date().getTime() });
        saveLogsToStorage();

        speakJarvis(reply);
        updateMemory(apiKey, activeModel);

      } catch (err) {
        appendMsgToDOM('error', `오류 안내: ${err.message}`);
      }
    }

    async function updateMemory(apiKey, activeModel) {
      const recentSlice = chatHistory.slice(-4).map(i => `${i.role}: ${i.content}`).join("\n");
      const memoryPrompt = `다음 대화에서 사용자의 신상, 선호, 목표 등 핵심 사실만 3줄 이내 요약으로 업데이트해줘.\n기존 기억: ${userProfileMemory}\n최근 대화:\n${recentSlice}`;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: activeModel,
            messages: [{ role: 'user', content: memoryPrompt }],
            max_tokens: 100
          })
        });
        const d = await res.json();
        if (d.choices && d.choices[0]) {
          userProfileMemory = d.choices[0].message.content.trim();
          saveLogsToStorage();
        }
      } catch (e) {}
    }

    // 아이언맨 자비스(폴 베타니) 느낌의 중저음 신사 톤 음향 튜닝
    function speakJarvis(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utter.voice = selectedVoice;
      utter.lang = 'ko-KR';

      // 폴 베타니 특유의 절제되고 낮은 피치와 일정한 호흡
      utter.pitch = 0.78; // 기존 0.85보다 더 중후하게 내려 자비스 느낌 강화
      utter.rate = 0.98;  // 너무 빠르지 않고 신사답게 조율

      const reactor = document.getElementById('reactor');
      reactor.classList.add('speaking');
      utter.onend = () => reactor.classList.remove('speaking');
      utter.onerror = () => reactor.classList.remove('speaking');

      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
